server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    access_log /var/log/nginx/access.log;
    client_max_body_size 50m;

    # 带 hash 的静态资源可长期缓存
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vue Router history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 后端接口。后端 server.servlet.context-path=/api，
    # 所以这里保留 /api 前缀原样透传（proxy_pass 不带结尾斜杠）。
    location /api/ {
        proxy_pass         http://app:8123;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE 必须清空 Connection 头，交给后端 keep-alive
        proxy_set_header   Connection        "";

        # 关键：SSE 流式输出，关闭缓冲，否则内容会被攒到结束才吐出
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;

        # AI 推理可能很慢，超时放宽
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}
